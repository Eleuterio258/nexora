<body id="pagina">

    <div class="page">
        <div class="card-login">
            <div class="logo">
                <a href="index.php">
                    <img src="assets/img/logo.png" alt="Gestão de Obras" width="130">
                </a>
            </div>

            <h1 class="title">Acesse sua conta</h1>

            <form method="post" action="autenticar.php" id="login-form">
                <div class="form-group">
                    <label for="usuario">Usuário</label>
                    <input class="form-control" name="usuario" id="usuario" type="text" placeholder="Digite seu Usuário" required>
                </div>

                <div class="form-group">
                    <label for="password-field" class="control-label">Senha</label>
                    <div class="password-wrapper">
                        <input id="password-field" type="password" class="form-control" name="senha" placeholder="Digite sua Senha" required>
                        <span toggle="#password-field" class="fa fa-fw fa-eye field-icon toggle-password"></span>
                    </div>
                </div>

                <div class="checkbox-group">
                    <input class="form-check-input" type="checkbox" value="Sim" name="salvar" id="salvar_acesso">
                    <label for="salvar_acesso" class="control-label">Salvar Acesso</label>
                </div>

                <button type="submit" class="btn btn-primary">Entrar no Sistema</button>
            </form>

            <div class="forgot-password">
                <a href="#" id="btn-open-modal">Esqueceu sua Senha?</a>
            </div>
        </div>
    </div>

    <!-- Modal Recuperar Senha -->
    <div class="modal-overlay" id="modal-recuperar">
        <div class="modal">
            <div class="modal-header">
                <h5 class="modal-title">Recuperar Senha</h5>
                <button type="button" class="btn-close" aria-label="Close">&times;</button>
            </div>

            <form method="post" id="form-recuperar" action="recuperar-senha.php">
                <div class="modal-body">
                    <label for="email-recuperar" class="control-label">Email:</label>
                    <input placeholder="Digite seu Email" class="form-control" type="email" name="email" id="email-recuperar" required>

                    <br>

                    <label for="telefone-recuperar" class="control-label">Telefone:</label>
                    <input placeholder="Digite seu Telefone" class="form-control" type="text" name="telefone" id="telefone-recuperar" required>

                    <div id="mensagem-recuperar" class="message"></div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="btn-cancel-modal">Fechar</button>
                    <button type="submit" class="btn btn-primary">Recuperar Senha</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Formulário oculto para auto-login com localStorage (compatibilidade com original) -->
