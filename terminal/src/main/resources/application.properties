app.title=Terminar Assiduidade
app.company=Nexora
app.version=1.0.0

# Base de dados SQLite local
db.url=jdbc:sqlite:data/assiduidade.db

# Modo de simulação da leitora biométrica (true = sem hardware, false = tenta ligar ao dispositivo)
fingerprint.simulation=true

# Timeout para voltar ao ecrã inicial após inactividade (segundos)
session.timeout.seconds=30

# PIN de acesso ao painel de administração (funcionários/QR). MUDAR em produção.
admin.pin=0000

# Webcam: índice da câmara por defeito (0 = primeira)
webcam.default.index=0

# QR Code: tamanho em pixels do QR gerado
qrcode.size=300

# Ecrã do terminal físico (janela fixa, não redimensionável) — painel táctil de 6,5"
screen.width=400
screen.height=200

# Janela do painel de administração (funcionários/QR): a lista de funcionários tem 9 colunas
# e não cabe no ecrã táctil acima, por isso a janela redimensiona-se temporariamente para este
# tamanho ao entrar no admin, voltando ao tamanho do ecrã do terminal ao sair.
admin.screen.width=1000
admin.screen.height=650

# Integração com o Nexora ERP (backend/): sincroniza funcionários (nome/número/activo) e
# envia cada marcação de ponto para /api/hardware/events/generic. PIN/QR/NFC/digital
# continuam geridos localmente. Vazio (por defeito) = integração desactivada.
# Chave obtida em POST /api/hardware/devices no ERP (permissão de admin do módulo hardware).
api.base.url=
api.device.key=

# Ciclo automático em segundo plano (só corre com api.base.url/api.device.key preenchidos):
# sincroniza funcionários (nome/número/activo) e reenvia marcações que falharam a chegar ao
# ERP (ex.: rede em baixo no momento da marcação) — sem isto, uma falha de rede perdia
# silenciosamente a marcação até alguém notar e sincronizar manualmente.
erp.sync.interval.seconds=300
