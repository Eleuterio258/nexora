<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Curso de Inglês Passo a Passo — 18 Aulas</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 3840px; height: 2160px; overflow: hidden; }
  body { font-family: "Segoe UI", Arial, sans-serif; background: #fbfaf6; color: #10234f; }
  .poster {
    width: 3840px; height: 2160px;
    padding: 64px 92px 52px;
    display: grid;
    grid-template-rows: 250px 1fr 156px;
    gap: 28px;
    background:
      radial-gradient(circle at 2% 4%, rgba(20,155,158,.11) 0 8px, transparent 9px),
      radial-gradient(circle at 98% 5%, rgba(242,170,19,.12) 0 9px, transparent 10px),
      #fbfaf6;
  }
  header { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
  .eyebrow { color: #10878f; font-size: 34px; font-weight: 850; letter-spacing: 7px; margin-bottom: 14px; display: flex; align-items: center; gap: 20px; }
  .mini-flag { width: 58px; height: 36px; border-radius: 4px; box-shadow: 0 0 0 2px rgba(11,35,83,.08); }
  h1 { margin: 0; color: #0b2353; font-size: 94px; line-height: 1; letter-spacing: 2px; font-weight: 950; }
  h1 .accent {
    background: linear-gradient(90deg,#149b9e,#ef625b,#f2aa13,#419ee0,#8c7bd8);
    -webkit-background-clip: text; color: transparent;
  }
  .subtitle { margin: 18px 0 0; color: #58667d; font-size: 29px; font-weight: 650; letter-spacing: 1px; }
  header::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; border-radius: 9px; background: linear-gradient(90deg,#149b9e,#419ee0,#8c7bd8,#ef625b,#f2aa13,#149b9e); }
  .grid { display: grid; grid-template-columns: repeat(6,1fr); grid-template-rows: repeat(3,1fr); gap: 24px; min-height: 0; }
  .card {
    --accent: #149b9e;
    background: #fff;
    border: 3px solid color-mix(in srgb,var(--accent) 55%,white);
    border-radius: 29px;
    padding: 27px 29px 25px;
    position: relative;
    overflow: hidden;
    display: grid;
    grid-template-columns: 112px 1fr 125px;
    grid-template-rows: 102px 1fr 62px;
    gap: 14px 18px;
    box-shadow: 0 7px 0 rgba(16,35,79,.025);
  }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 11px; background: var(--accent); }
  .number {
    width: 102px; height: 102px; border-radius: 22px;
    display: grid; place-items: center;
    background: var(--accent); color: #fff;
    font-size: 48px; font-weight: 950; letter-spacing: -2px;
  }
  .lesson {
    align-self: center; color: #6b768a;
    font-size: 23px; font-weight: 850; letter-spacing: 2px;
  }
  .icon {
    grid-column: 3; grid-row: 1 / 3;
    align-self: center; justify-self: center;
    font-family: "Segoe UI Emoji","Apple Color Emoji",sans-serif;
    font-size: 92px; line-height: 1;
    filter: drop-shadow(0 3px 0 rgba(16,35,79,.10));
  }
  .topic {
    grid-column: 1 / 3; grid-row: 2;
    align-self: center;
    padding: 28px 10px 24px 2px;
    border-top: 1px solid #e1e6ea;
    color: #11244d; font-size: 39px; line-height: 1.12; font-weight: 900;
  }
  .step {
    grid-column: 1 / 4; grid-row: 3;
    display: flex; align-items: center; gap: 16px;
    color: var(--accent); font-size: 20px; font-weight: 850; letter-spacing: 1.5px;
  }
  .step::after { content: ""; flex: 1; height: 3px; border-radius: 3px; background: color-mix(in srgb,var(--accent) 34%,white); }
  .step .arrow { font-size: 30px; }
  footer {
    border: 2px solid #d8e2e5; border-radius: 28px; background: #fff;
    display: grid; grid-template-columns: 1.1fr 2.4fr 1.1fr; align-items: center;
    padding: 20px 40px; position: relative; overflow: hidden;
  }
  footer::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 12px; background: #149b9e; }
  .footer-side { color: #647189; font-size: 24px; font-weight: 750; }
  .footer-side:last-child { text-align: right; }
  .motivation {
    justify-self: center; color: #fff; background: #0b2353;
    border-radius: 999px; padding: 20px 62px;
    font-size: 38px; line-height: 1; font-weight: 950; letter-spacing: 2px;
  }
</style>
</head>
<body>
<main class="poster">
  <header>
    <div class="eyebrow">
      <svg class="mini-flag" viewBox="0 0 60 36" aria-label="Bandeira do Reino Unido" role="img">
        <clipPath id="uk-course"><rect width="60" height="36" rx="3"/></clipPath>
        <g clip-path="url(#uk-course)">
          <rect width="60" height="36" fill="#012169"/>
          <path d="M0 0L60 36M60 0L0 36" stroke="#fff" stroke-width="8"/>
          <path d="M0 0L60 36M60 0L0 36" stroke="#C8102E" stroke-width="4"/>
          <path d="M30 0V36M0 18H60" stroke="#fff" stroke-width="12"/>
          <path d="M30 0V36M0 18H60" stroke="#C8102E" stroke-width="7"/>
        </g>
      </svg>
      <span>APRENDA PASSO A PASSO</span><span>📖</span>
    </div>
    <h1>CURSO DE <span class="accent">INGLÊS</span> PASSO A PASSO</h1>
    <p class="subtitle">18 aulas essenciais para construir vocabulário e confiança em inglês</p>
  </header>
  <section class="grid" id="lessons" aria-label="Lista das 18 aulas do curso"></section>
  <footer>
    <div class="footer-side">🚀 COMEÇAR</div>
    <div class="motivation">LET’S LEARN ENGLISH!</div>
    <div class="footer-side">PRATICAR TODOS OS DIAS 🏆</div>
  </footer>
</main>
<script>
const lessons = [
  ['Comida','🍽️'],
  ['Bebidas','🥤'],
  ['Breakfast','🍳'],
  ['Lunch and dinner','🍲'],
  ['My family','👨‍👩‍👧‍👦'],
  ['At School part 1','🏫'],
  ['At School part 2','✏️'],
  ['Colors','🎨'],
  ['Numbers part 1','1️⃣'],
  ['Review 1','🔁'],
  ['Numbers part 2','🔢'],
  ['Instruments','🎸'],
  ['Sports','⚽'],
  ['Toys','🧸'],
  ['My house','🏠'],
  ['My bedroom','🛏️'],
  ['In the bathroom','🛁'],
  ['In the living room','🛋️']
];
const colors = ['#149b9e','#ef625b','#f2aa13','#419ee0','#8c7bd8','#52b89f'];
const grid = document.getElementById('lessons');
lessons.forEach(([topic,icon],i) => {
  const n = String(i+1).padStart(2,'0');
  const card = document.createElement('article');
  card.className = 'card';
  card.style.setProperty('--accent',colors[i % colors.length]);
  card.innerHTML = `
    <div class="number">${n}</div>
    <div class="lesson">AULA ${i+1}</div>
    <div class="icon" aria-hidden="true">${icon}</div>
    <div class="topic">${topic}</div>
    <div class="step">CURSO DE INGLÊS <span class="arrow">→</span></div>`;
  grid.appendChild(card);
});
</script>
</body>
</html>
