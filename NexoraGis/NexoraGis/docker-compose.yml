# Stack única do NexoraGis — a mesma para desenvolvimento e produção.
#
#   docker compose up -d --build          # API + PostGIS (o que corre em produção)
#   docker compose --profile extras up -d # + MinIO, GeoServer e Redis locais
#
# Em produção a API é publicada em https://${API_HOST} pelo Traefik (rede
# externa `backend`, resolver ACME `le`). O GeoServer de produção NÃO está aqui:
# corre no host (Jetty, porta 8090) e é alcançado por host.docker.internal.
name: nexoragis

services:
  # Base local opcional. Por omissao o NexoraGis usa o Postgres partilhado da
  # maquina (container `postgres`), que desde 2026-08-21 tem PostGIS. Este
  # servico so sobe com --profile extras, para trabalhar offline; nesse caso
  # poe-se POSTGRES_HOST=nexoragis-db no .env.
  db:
    profiles: ["extras"]
    image: postgis/postgis:16-3.4
    container_name: nexoragis-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexoragis}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD no .env}
    # Só no loopback: é por aqui que o GeoServer do host chega ao PostGIS
    # (a datastore criada pela API aponta para 127.0.0.1:${POSTGRES_PORT}).
    ports:
      - "127.0.0.1:${POSTGRES_LOCAL_PORT:-5435}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nexoragis}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nexoragis

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexoragis-api:latest
    container_name: nexoragis-api
    restart: unless-stopped
    depends_on:
      # Só conta quando o profile `extras` sobe a base local; com o Postgres
      # partilhado (o caso normal) o serviço nem existe no arranque.
      db:
        condition: service_healthy
        required: false
    extra_hosts:
      # GeoServer e qualquer outro serviço que corra directamente no host.
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      BehindReverseProxy: "true"
      ConnectionStrings__Default: "Host=${POSTGRES_HOST:-postgres};Port=${POSTGRES_INTERNAL_PORT:-5432};Database=${POSTGRES_DB:-nexoragis};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD};SSL Mode=Disable"
      Database__MigrateOnStartup: "true"

      Jwt__SigningKey: ${JWT_SIGNING_KEY:?define JWT_SIGNING_KEY no .env}
      Jwt__Issuer: ${JWT_ISSUER:-NexoraGis.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-NexoraGis.Client}

      # Documento OpenAPI em /openapi/v1.json (a UI não é servida).
      OpenApi__Expose: ${OPENAPI_EXPOSE:-true}

      # Primeiro administrador: só é criado se a base estiver vazia E esta
      # palavra-passe estiver definida. Pode sair do .env após o 1.º arranque.
      Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      Bootstrap__AdminUsername: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      Bootstrap__AdminEmail: ${BOOTSTRAP_ADMIN_EMAIL:-admin@e258tech.xyz}
      Bootstrap__OrganizacaoCodigo: ${BOOTSTRAP_ORG_CODIGO:-E258}
      Bootstrap__OrganizacaoDesignacao: ${BOOTSTRAP_ORG_DESIGNACAO:-e258tech}

      GeoServer__BaseUrl: ${GEOSERVER_BASE_URL:-http://host.docker.internal:8090/geoserver/rest}
      GeoServer__Username: ${GEOSERVER_ADMIN_USER:-admin}
      GeoServer__Password: ${GEOSERVER_ADMIN_PASSWORD:?define GEOSERVER_ADMIN_PASSWORD no .env}
      GeoServer__Workspace: ${GEOSERVER_WORKSPACE:-nexoragis}
      GeoServer__DataStore: ${GEOSERVER_DATASTORE:-nexoragis_postgis}
      GeoServer__DbSchema: ${GEOSERVER_DB_SCHEMA:-cadastro}
      # Db* é visto a partir do GeoServer, que corre no host — daí o loopback.
      GeoServer__DbHost: ${GEOSERVER_DB_HOST:-127.0.0.1}
      GeoServer__DbPort: ${POSTGRES_PORT:-5432}
      GeoServer__DbName: ${POSTGRES_DB:-nexoragis}
      GeoServer__DbUser: ${POSTGRES_USER:-postgres}
      GeoServer__DbPassword: ${POSTGRES_PASSWORD}
    volumes:
      # Chaves do ASP.NET Data Protection: sem isto são regeneradas a cada
      # recriação do container.
      - dataprotection:/home/app/.aspnet/DataProtection-Keys
    networks:
      - nexoragis
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=backend"
      - "traefik.http.routers.nexoragis.rule=Host(`${API_HOST:-gis.e258tech.xyz}`)"
      - "traefik.http.routers.nexoragis.entrypoints=websecure"
      - "traefik.http.routers.nexoragis.tls=true"
      - "traefik.http.routers.nexoragis.tls.certresolver=le"
      - "traefik.http.routers.nexoragis.middlewares=security-headers@file,compression@file"
      - "traefik.http.services.nexoragis.loadbalancer.server.port=8080"

  # --- Serviços locais opcionais (profile `extras`) ------------------------
  # Em produção não se usam: o MinIO é o partilhado em s3.e258tech.tech e o
  # GeoServer é o do host na 8090.

  minio:
    profiles: ["extras"]
    image: minio/minio:latest
    container_name: nexoragis-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9012}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9013}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nexoragis

  geoserver:
    profiles: ["extras"]
    image: kartoza/geoserver:2.25.2
    container_name: nexoragis-geoserver
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      GEOWEBCACHE_CACHE_DIR: /opt/geoserver_data/gwc
    ports:
      - "127.0.0.1:${GEOSERVER_PORT:-8600}:8080"
    volumes:
      - geoserver_data:/opt/geoserver_data
    networks:
      - nexoragis

  redis:
    profiles: ["extras"]
    image: redis:7-alpine
    container_name: nexoragis-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    networks:
      - nexoragis

volumes:
  db_data:
    name: nexoragis_db_data
  dataprotection:
    name: nexoragis_dataprotection
  minio_data:
    name: nexoragis_minio_data
  geoserver_data:
    name: nexoragis_geoserver_data
  redis_data:
    name: nexoragis_redis_data

networks:
  nexoragis:
    driver: bridge
  backend:
    external: true
